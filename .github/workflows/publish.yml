# Publishes idp2aws to PyPI when a GitHub release is published.
#
# The release tag must be "v" plus __version__ in src/idp2aws/__init__.py,
# and the version must be the next patch, minor or major version after the
# latest one on PyPI. scripts/check_version.py enforces both.
#
# PyPI trusts this workflow through trusted publishing, so no API token is
# stored in GitHub.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    name: Test and check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: pylint src scripts
      - name: Check the version against the tag and PyPI
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_version.py "$TAG"

  build:
    name: Build the packages
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/idp2aws/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
